name: Render STIK Shorts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - '.github/workflows/render.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx remotion browser ensure
      - run: npm run render
      - uses: actions/upload-artifact@v4
        with:
          name: STIK001-MP4
          path: out/STIK001.mp4
          retention-days: 7
